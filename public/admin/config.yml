# Decap CMS 配置
# 文档：https://decapcms.org/docs/configuration-options/
#
# 生产环境需要把下面的 repo 改成你的仓库，并配一个 OAuth 代理：
#   backend.base_url: https://<你的-oauth-代理>
# 本地开发用 `npx decap-server`，会走 local_backend。

local_backend: true

backend:
  name: github
  repo: mh567/mainpage
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

locale: zh_Hans

collections:
  - name: notes
    label: 短帖
    label_singular: 短帖
    description: 微博/朋友圈式的短文本与图片
    folder: src/content/notes
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - name: date
        label: 日期
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: kind
        label: 类型
        widget: select
        options: [note, link, photo, quote, release]
        default: note
      - name: title
        label: 标题（可选）
        widget: string
        required: false
      - name: body
        label: 正文
        widget: markdown
      - name: images
        label: 图片
        widget: list
        required: false
        field:
          name: image
          label: 图片
          widget: image
      - name: link
        label: 外部链接
        widget: string
        required: false
      - name: tags
        label: 标签
        widget: list
        required: false
        default: []
      - name: draft
        label: 草稿
        widget: boolean
        default: false

  - name: projects
    label: 项目
    label_singular: 项目
    description: 首页与 /projects 展示的项目入口
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - name: title
        label: 名称
        widget: string
      - name: summary
        label: 一句话简介
        widget: string
        hint: 建议不超过 15 个词
      - name: url
        label: 线上地址
        widget: string
        required: false
      - name: repo
        label: 仓库地址
        widget: string
        required: false
      - name: body
        label: 详细介绍（可选）
        widget: markdown
        required: false
      - name: tags
        label: 技术栈 / 关键词
        widget: list
        required: false
        default: []
      - name: status
        label: 状态
        widget: select
        options: [active, maintained, wip, archived]
        default: active
      - name: featured
        label: 首页精选
        widget: boolean
        default: false
      - name: order
        label: 排序（越小越靠前）
        widget: number
        default: 0
        value_type: int
      - name: started
        label: 开始时间
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - name: cover
        label: 封面图
        widget: image
        required: false

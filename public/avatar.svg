<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="harris">
  <defs>
    <linearGradient id="bg" x1="40" y1="16" x2="216" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f628f"/>
      <stop offset="0.5" stop-color="#243a58"/>
      <stop offset="1" stop-color="#111c2d"/>
    </linearGradient>
    <linearGradient id="halo" x1="50" y1="12" x2="150" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <circle cx="128" cy="128" r="120"/>
    </clipPath>
  </defs>

  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <ellipse cx="92" cy="54" rx="98" ry="58" fill="url(#halo)"/>

    <!-- 香槟金地平线弧 -->
    <circle cx="128" cy="252" r="74" fill="none" stroke="#e4b863" stroke-width="4" opacity="0.75"/>

    <!-- H 字母 -->
    <g fill="#f4f7fc">
      <rect x="79" y="82" width="22" height="92" rx="9"/>
      <rect x="155" y="82" width="22" height="92" rx="9"/>
      <rect x="95" y="117" width="66" height="22" rx="9"/>
    </g>
  </g>

  <circle cx="128" cy="128" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
</svg>
